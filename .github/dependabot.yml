# Dependabot opens pull requests when dependencies have updates; CI runs on each one.
# Minor and patch updates are grouped into one weekly PR to keep the noise down.
# Major versions arrive as separate PRs, because they need reading the changelog.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
